<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d542b">
    <title>No internet - T5 CRM</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; color: #1f2937; font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
        .box { max-width: 360px; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 18px; margin: 16px 0 8px; }
        p { font-size: 14px; color: #6b7280; margin: 0 0 20px; }
        button { height: 32px; padding: 0 16px; border: 0; border-radius: 8px; background: #0d542b; color: #fff; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/icons/icon-192.png" alt="">
        <h1>No internet</h1>
        <p>T5 CRM needs the internet. Check the connection, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
